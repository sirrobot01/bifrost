# The deb and rpm packages install the binary under /usr/bin, while the unit in
# deploy/bifrost.service targets a manual install under /usr/local/bin. A
# drop-in keeps one hardened unit as the single source of truth: a second copy
# of it would eventually drift from this one on a hardening change.
#
# Clearing ExecStart with an empty assignment is how systemd replaces the
# command instead of appending a second one.
[Service]
ExecStart=
ExecStart=/usr/bin/bifrost serve --config /etc/bifrost/config.yaml
