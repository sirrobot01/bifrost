name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/bifrost-linux-amd64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/bifrost-linux-arm64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o /tmp/bifrost-linux-armv7 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/bifrost-darwin-amd64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/bifrost-darwin-arm64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -trimpath -o /tmp/bifrost-freebsd-amd64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=freebsd GOARCH=arm64 go build -trimpath -o /tmp/bifrost-freebsd-arm64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=amd64 go build -trimpath -o /tmp/bifrost-openbsd-amd64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=openbsd GOARCH=arm64 go build -trimpath -o /tmp/bifrost-openbsd-arm64 ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/bifrost-windows-amd64.exe ./cmd/bifrost
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o /tmp/bifrost-windows-arm64.exe ./cmd/bifrost
      - run: docker build --build-arg VERSION=ci .
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --snapshot --clean --skip=sign
      # The hosted install script is the shortest setup path, so install
      # through it for real, pointed at the snapshot artifacts. This covers
      # arch detection, checksum verification, and the deb path in one step.
      - name: Install through install.sh
        run: |
          set -eux
          python3 -m http.server 8321 --directory dist >/dev/null 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          BIFROST_DOWNLOAD=http://127.0.0.1:8321 sh docs/public/install.sh
      - name: Verify the installed layout
        run: |
          set -eux
          test -x /usr/bin/bifrost
          test -f /lib/systemd/system/bifrost.service
          test -f /lib/systemd/system/bifrost.service.d/10-package-path.conf
          getent passwd bifrost
          getent passwd bifrost-edge
          # Traversable so the bifrost-edge account reaches its own config on
          # an edge host. The address secret and DNS credentials inside carry
          # their own 0600 modes, which Bifrost verifies before reading them.
          test "$(stat -c '%U:%G:%a' /etc/bifrost)" = "bifrost:bifrost:755"
          systemd-analyze verify /lib/systemd/system/bifrost.service
          bifrost version
      - name: Verify doctor runs without a configuration
        run: |
          set -eux
          # A host with no usable IPv6 must still produce a report and exit 1,
          # never a usage error about a missing config file.
          bifrost doctor --offline --json > report.json || test $? -eq 1
          jq -e '.findings | length > 0' report.json
      - run: sudo apt-get remove -y bifrost
      # The script falls back to the archive where no package manager fits;
      # exercise that path in a container with neither apt nor dnf.
      - name: Smoke test the archive fallback
        run: |
          set -eux
          python3 -m http.server 8321 --directory dist >/dev/null 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          docker run --rm --network host \
            -v "$PWD/docs/public/install.sh:/install.sh:ro" \
            -e BIFROST_DOWNLOAD=http://127.0.0.1:8321 \
            alpine sh -c 'sh /install.sh && /usr/local/bin/bifrost version'

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o "$env:TEMP/bifrost-windows-amd64.exe" ./cmd/bifrost
      - shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/docs/public/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
